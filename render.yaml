services:
  - type: web
    name: pinn-depth
    runtime: docker
    plan: free
    numInstances: 1
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: LOW_MEMORY_MODE
        value: "1"
      - key: TORCH_HOME
        value: /tmp/torch_cache
